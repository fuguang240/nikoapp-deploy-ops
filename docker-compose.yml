services:
  mysql:
    image: mysql:8.0
    container_name: nikoapp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nikoapp_root}
      MYSQL_DATABASE: nikoapp
      MYSQL_USER: nikoapp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nikoapp_pass}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-nikoapp_root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    container_name: nikoapp-app
    environment:
      APP_PORT: "8080"
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: nginx:1.27
    container_name: nikoapp-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:

# NikoApp 唯一对外入口：反向代理 + 内网访问控制
upstream nikoapp_backend {
    server app:8080;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://nikoapp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 管理/调试接口：仅允许 docker 内网网段访问，外部一律拒绝
    location /api/admin {
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://nikoapp_backend;
    }
}
